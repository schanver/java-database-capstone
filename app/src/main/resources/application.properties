spring.application.name=back-end

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/cms?useSSL=false
spring.datasource.username=${MYSQL_USER:smartclinic}

spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# Set explicitly: the MySQL driver's metadata query fails against MariaDB
# (Unknown column 'RESERVED'), so Hibernate cannot auto-detect the dialect.
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Local mongod without auth needs no override. For an authenticated server, set
# MONGODB_URI=mongodb://root:<password>@<host>:27017/prescriptions?authSource=admin
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/prescriptions}

management.endpoint.health.show-details=always
management.health.db.enabled=true


api.path=/
jwt.secret=$!@#$^%$$$%####$DDCPN0234FCFDPD8670M



spring.web.resources.static-locations=classpath:/static/

# -------------------------
# Thymeleaf Configuration
# -------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false    
spring.thymeleaf.encoding=UTF-8