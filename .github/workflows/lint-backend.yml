name: Lint Backend

on:
  push:
  pull_request:

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    env:
      CHECKSTYLE_VERSION: "10.21.0"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Checkstyle
        run: |
          curl -fsSL -o checkstyle.jar \
            "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-${CHECKSTYLE_VERSION}/checkstyle-${CHECKSTYLE_VERSION}-all.jar"

      # google_checks.xml ships inside the Checkstyle jar.
      - name: Run Checkstyle
        run: java -jar checkstyle.jar -c /google_checks.xml app/src/main/java/com/project/back_end || true
